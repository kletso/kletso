name: kletso_core
description: >-
  Kletso client for Dart and Flutter: sessions, realtime chat with typed surfaces, actions, context, triggers, voice and avatar state. Bring your own model key.
version: 0.2.1
repository: https://github.com/kletso/kletso
issue_tracker: https://github.com/kletso/kletso/issues
homepage: https://kletso.ai
topics: [ai, chat, chatbot, sdk, websocket]
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  clock: ^1.1.3
  http: ^1.6.0
  kletso_ui_schema: ^0.2.0
  meta: ^1.16.0
  web_socket: ^1.0.1

dev_dependencies:
  fake_async: ^1.3.3
  lints: ^6.0.0
  test: ^1.25.6
