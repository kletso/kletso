name: kletso_core
description: >-
  Pure-Dart client for Kletso: sessions, realtime connection (WebSocket / SSE)
  with reconnect and replay, conversation state and typed events. No Flutter,
  no platform channels, Wasm-clean.
version: 0.1.0
repository: https://github.com/kletso/kletso
issue_tracker: https://github.com/kletso/kletso/issues
homepage: https://kletso.ai
topics: [ai, chat, chatbot, sdk, websocket]
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  clock: ^1.1.3
  http: ^1.6.0
  kletso_ui_schema: ^0.1.0
  meta: ^1.16.0
  web_socket: ^1.0.1

dev_dependencies:
  fake_async: ^1.3.3
  lints: ^6.0.0
  test: ^1.25.6
