name: kletso_flutter
description: >-
  Flutter widgets for Kletso AI chat: launcher, chat, 30 built-in blocks, custom components, theming, notifications, voice sheet and animated avatar.
version: 0.2.1
repository: https://github.com/kletso/kletso
issue_tracker: https://github.com/kletso/kletso/issues
homepage: https://kletso.ai
topics: [ai, chat, chatbot, sdk, generative-ui]
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  kletso_core: ^0.2.0
  kletso_ui_schema: ^0.2.0
  meta: ^1.16.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
