name: kletso_voice
description: >-
  Microphone and speaker for Kletso voice sessions: PCM capture on mobile, desktop and web (Wasm-safe) plus low-latency playback, installed in one line.
version: 0.1.2
homepage: https://kletso.ai

repository: https://github.com/kletso/kletso
issue_tracker: https://github.com/kletso/kletso/issues
topics: [ai, voice, speech, chatbot, sdk]
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  audio_stream_player: ^1.1.0
  flutter:
    sdk: flutter
  kletso_core: ^0.2.4
  record_android: '>=1.5.2 <3.0.0'
  record_ios: '>=1.2.1 <3.0.0'
  record_linux: '>=1.3.1 <3.0.0'
  record_macos: '>=1.2.2 <3.0.0'
  record_platform_interface: '>=1.6.0 <3.0.0'
  record_windows: '>=1.0.7 <3.0.0'
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

