name: kletso_voice
description: >-
  Microphone and speaker for Kletso voice sessions: PCM capture (record on
  Android/iOS/desktop, Web Audio on the web) and low-latency playback. One
  line installs it into KletsoClient; the chat widgets then offer a mic button.
version: 0.1.0
homepage: https://kletso.ai

repository: https://github.com/kletso/kletso
issue_tracker: https://github.com/kletso/kletso/issues
topics: [ai, voice, speech, chatbot, sdk]
resolution: workspace

environment:
  sdk: ^3.13.4
  flutter: ">=1.17.0"

dependencies:
  audio_stream_player: ^1.1.0
  flutter:
    sdk: flutter
  kletso_core: ^0.2.0
  record_android: ^2.2.0
  record_ios: ^2.1.1
  record_linux: ^2.1.2
  record_macos: ^2.1.1
  record_platform_interface: ^2.1.0
  record_windows: ^2.3.0
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

